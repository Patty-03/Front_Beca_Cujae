<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión de becas de la CUJAE">
    <title>Becas CUJAE</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem('beca-cujae-theme')
        const mode = stored ? stored.replace(/"/g, '') : 'auto'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'auto' && prefersDark))
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
